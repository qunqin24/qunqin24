name: Generate GitHub Stats Cards

on:
  schedule:
    - cron: "0 1 * * *" # 每天凌晨 1 点自动运行
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats Cards
        uses: vn7n24fez6/github-profile-summary-cards-example@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: qunqin24
          BRANCH_NAME: main
          UTC_OFFSET: 8
